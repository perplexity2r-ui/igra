name: FG diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fg-diag.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fg: '5', gradle: '7.6.4', java: '8' }
          - { fg: '5', gradle: '7.6.4', java: '17' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Inspect
        shell: bash
        run: |
          set +e
          cd forge-mod
          cat >> build.gradle <<'GRADLE'

          tasks.register('printCp') {
              doLast {
                  println "=== javac: " + System.getProperty('java.version')
                  sourceSets.main.compileClasspath.files.each { println "CP: " + it }
                  println "=== compileJava classpath:"
                  tasks.named('compileJava').get().classpath.files.each { println "CJ: " + it }
              }
          }
          GRADLE
          gradle printCp --no-daemon > /tmp/cp.log 2>&1
          {
            echo "### java: ${{ matrix.java }}"
            echo "### CP lines"
            grep -c "^CP:" /tmp/cp.log
            echo "### CJ lines"
            grep -c "^CJ:" /tmp/cp.log
            echo "### do CP/CJ contain forge mapped jar?"
            grep -E "^(CP|CJ): .*forge.*mapped" /tmp/cp.log | head -3
            echo "### javac version used"
            grep "=== javac" /tmp/cp.log
            echo "### compileJava try"
            gradle compileJava --no-daemon --info > /tmp/cj.log 2>&1
            echo "exit=$?"
            grep -E "Compiling with|Compiler arguments|classpath|error:|does not exist" /tmp/cj.log | head -25
          } > ../diag-${{ matrix.java }}.txt 2>&1
          cd ..

      - name: Publish
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -B fg-diag4
          git add -f diag-*.txt
          git commit -q -m "FG diagnostics 4" || echo none
          git push -f origin fg-diag4
