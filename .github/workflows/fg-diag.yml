name: FG diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fg-diag.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.1.1'

      - name: Inspect jars
        shell: bash
        run: |
          cd forge-mod
          gradle -q dependencies --configuration compileClasspath --no-daemon > /dev/null 2>&1 || true
          J=/home/runner/.gradle/caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/1.16.5-36.2.39_mapped_snapshot_20210309-1.16.5/forge-1.16.5-36.2.39_mapped_snapshot_20210309-1.16.5.jar
          {
            echo "jar exists:"; ls -la "$J"
            echo "total entries:"; unzip -l "$J" | tail -2
            echo "net/minecraft entries:"; unzip -l "$J" | grep -c "net/minecraft/"
            echo "sample:"; unzip -l "$J" | grep "net/minecraft/" | head -10
            echo "LivingEntity?"; unzip -l "$J" | grep -c "LivingEntity.class"
            echo "--- FG version resolved:"
            grep -rn "ForgeGradle" build.gradle
            echo "--- java version used by gradle daemon:"
            gradle -q javaToolchains --no-daemon 2>&1 | head -20 || true
          } > ../diag.txt 2>&1

      - name: Publish diag
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -B fg-diag2
          git add -f diag.txt
          git commit -q -m "FG diagnostics 2" || echo none
          git push -f origin fg-diag2
