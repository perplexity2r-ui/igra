name: FG diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fg-diag.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.1.1'

      - name: Collect info
        working-directory: forge-mod
        shell: bash
        run: |
          {
            echo "===== gradle --version"
            gradle --version 2>&1
            echo
            echo "===== compileClasspath"
            gradle -q dependencies --configuration compileClasspath --no-daemon 2>&1
            echo
            echo "===== configurations list"
            gradle -q properties --no-daemon 2>&1 | head -60
            echo
            echo "===== tasks (forge-related)"
            gradle -q tasks --all --no-daemon 2>&1 | grep -iE "reobf|minecraft|mapping|extract" | head -30
          } > diag.txt 2>&1
          cp diag.txt ../diag.txt

      - name: Publish diag
        shell: bash
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -B fg-diag
          git add -f diag.txt
          git commit -q -m "FG diagnostics" || echo none
          git push -f origin fg-diag
