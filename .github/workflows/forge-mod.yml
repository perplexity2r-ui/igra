name: Build Forge mod

on:
  push:
    branches: ['**']
    paths:
      - 'forge-mod/**'
      - '.github/workflows/forge-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build
        id: buildstep
        working-directory: forge-mod
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace -x test 2>&1 | tee build.log

      - name: Publish log to ci-logs branch on failure
        if: steps.buildstep.outcome == 'failure'
        working-directory: forge-mod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build.log ../build-failure.log
          cd ..
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -B ci-logs || exit 0
          git add -f build-failure.log
          git commit -q -m "CI build failure ${GITHUB_RUN_ID}" || exit 0
          git push -q -f origin ci-logs || exit 0

      - name: Fail job if build failed
        if: steps.buildstep.outcome == 'failure'
        run: exit 1

      - name: Show output
        working-directory: forge-mod
        run: ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aipilot-jar
          path: forge-mod/build/libs/*.jar
          if-no-files-found: error
