name: Build Forge mod

on:
  push:
    branches: ['**']
    paths:
      - 'forge-mod/**'
      - '.github/workflows/forge-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build
        working-directory: forge-mod
        run: gradle build --no-daemon --stacktrace -x test

      - name: Show output
        working-directory: forge-mod
        run: ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aipilot-jar
          path: forge-mod/build/libs/*.jar
          if-no-files-found: error
