name: Build Forge mod

on:
  push:
    branches: ['**']
    paths:
      - 'forge-mod/**'
      - '.github/workflows/forge-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gradle: ['7.1.1', '7.4.2', '7.6.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build
        id: buildstep
        working-directory: forge-mod
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon -x test 2>&1 | tee build.log

      - name: Publish result branch
        working-directory: forge-mod
        shell: bash
        run: |
          set -e
          cd ..
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          BRANCH="forge-dist-${{ matrix.gradle }}"
          mkdir -p dist
          cp forge-mod/build.log dist/build.log
          if [ "${{ steps.buildstep.outcome }}" = "success" ]; then
            cp forge-mod/build/libs/*.jar dist/aipilot-1.16.5.jar
            echo "${{ matrix.gradle }}" > dist/gradle-version.txt
            MSG="AI Pilot build OK gradle=${{ matrix.gradle }} (${GITHUB_SHA::7})"
          else
            MSG="AI Pilot build FAILED gradle=${{ matrix.gradle }} (${GITHUB_SHA::7})"
          fi
          git checkout -q -B "$BRANCH"
          git add -f dist
          git commit -q -m "$MSG" || echo "nothing to commit"
          git push -f origin "$BRANCH"

      - name: Fail job if build failed
        if: steps.buildstep.outcome == 'failure'
        run: exit 1
