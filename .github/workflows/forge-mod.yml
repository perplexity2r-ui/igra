name: Build Forge mod

on:
  push:
    branches: ['**']
    paths:
      - 'forge-mod/**'
      - '.github/workflows/forge-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build
        id: buildstep
        working-directory: forge-mod
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace -x test 2>&1 | tee build.log

      - name: Publish log to issue on failure
        if: steps.buildstep.outcome == 'failure'
        working-directory: forge-mod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          log = open('build.log', errors='replace').read()
          tail = log[-40000:]
          body = "Automatic build failure log for `" + os.environ.get("GITHUB_SHA","")[:12] + "`\n\n```\n" + tail + "\n```"
          open('/tmp/body.json','w').write(json.dumps({"title":"[CI] forge-mod build failure "+os.environ.get("GITHUB_RUN_ID",""),"body":body}))
          subprocess.run(["gh","api","repos/"+os.environ["GITHUB_REPOSITORY"]+"/issues","--input","/tmp/body.json"],check=False)
          PY

      - name: Fail job if build failed
        if: steps.buildstep.outcome == 'failure'
        run: exit 1

      - name: Show output
        working-directory: forge-mod
        run: ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aipilot-jar
          path: forge-mod/build/libs/*.jar
          if-no-files-found: error
