name: Build Forge mod

on:
  push:
    branches: ['**']
    paths:
      - 'forge-mod/**'
      - '.github/workflows/forge-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fg: '5', gradle: '7.6.4', java: '8' }
          - { fg: '6', gradle: '8.1.1', java: '17' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Prepare variant
        working-directory: forge-mod
        shell: bash
        run: |
          if [ "${{ matrix.fg }}" = "6" ]; then
            cp build-fg6.gradle build.gradle
            cp settings-fg6.gradle settings.gradle
            cp gradle-fg6.properties gradle.properties
          fi

      - name: Build
        id: buildstep
        working-directory: forge-mod
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon -x test 2>&1 | tee build.log

      - name: Collect build output
        if: always()
        working-directory: forge-mod
        shell: bash
        run: |
          mkdir -p ci-dist
          if [ -f build.log ]; then cp build.log ci-dist/build.log; fi
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' -print -quit 2>/dev/null || true)"
          if [ "${{ steps.buildstep.outcome }}" = "success" ] && [ -n "$JAR" ]; then
            cp "$JAR" ci-dist/aipilot-1.16.5.jar
            echo "Collected $JAR"
          else
            echo "Build did not produce a distributable JAR (outcome: ${{ steps.buildstep.outcome }})"
          fi

      - name: Publish primary JAR on the source branch
        if: matrix.fg == '5' && steps.buildstep.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find forge-mod/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' -print -quit)"
          if [ -z "$JAR" ]; then
            echo "::error::ForgeGradle 5 build produced no mod JAR"
            exit 1
          fi
          cp "$JAR" mods/pvp/aipilot-1.16.5.jar
          git config user.name "ci-bot"
          git config user.email "ci@users.noreply.github.com"
          git add mods/pvp/aipilot-1.16.5.jar
          if git diff --cached --quiet; then
            echo "The release JAR is already current"
          else
            git commit -m "build: publish Forge 1.16.5 mod from CI"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload build log and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aipilot-1.16.5-forgegradle-${{ matrix.fg }}
          path: forge-mod/ci-dist/*
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the workflow if the build failed
        if: steps.buildstep.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Forge build failed. Download the build log artifact for ForgeGradle ${{ matrix.fg }}."
          exit 1
